<g text-anchor="middle" dominant-baseline="middle">
<text x="500" y="50">?- suma(3, S).</text>
<text x="560" y="140">?- 3 &gt; 1, N1 is 3-1, suma(N1, S1), S is 3+S1.</text>
<text x="560" y="230">?- suma(2, S1), S is 3+S1.</text>
<text x="610" y="320">?- 2 &gt; 1, N2 is 2-1, suma(N2, S2), S1 is 2+S2, S is 3+S1.</text>
<text x="610" y="410">?- suma(1, S2), S1 is 2+S2, S is 3+S1.</text>
<text x="380" y="500">?- S1 is 2+1, S is 3+S1.</text>
<text x="380" y="590">?- S is 3+3.</text>
<text x="790" y="500">?- 1 &gt; 1, N3 is 1-1, suma(N3, S3), ...</text>
<text x="200" y="140" fill="#c0392b">✗ suma(1,1) no unifica</text>
<text x="250" y="320" fill="#c0392b">✗ no unifica</text>
<text x="790" y="590" fill="#c0392b">✗ fallo: 1 &gt; 1 es falso</text>
<text x="380" y="680" fill="#1e8449" font-weight="bold">□ éxito: S = 6</text>
</g>
</svg>
