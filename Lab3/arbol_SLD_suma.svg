<text x="330" y="92">C1</text>
<text x="540" y="92">C2</text>
<text x="570" y="190">3&gt;1 ✓, N1 = 2</text>
<text x="380" y="272">C1</text>
<text x="595" y="272">C2</text>
<text x="620" y="370">2&gt;1 ✓, N2 = 1</text>
<text x="420" y="452">C1: S2 = 1</text>
<text x="710" y="452">C2 (backtracking)</text>
<text x="390" y="550">S1 = 3</text>
<text x="390" y="640">S = 6</text>
