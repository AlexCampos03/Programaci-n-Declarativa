<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Consolas, monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="500" y="20" text-anchor="middle" font-size="16" font-weight="bold">Árbol SLD: ?- suma(3, S).</text>
<g stroke="#444" stroke-width="1.5">
<line x1="500" y1="66" x2="200" y2="124"/>
<line x1="500" y1="66" x2="560" y2="124"/>
